[project]
name = "wayfinder"
version = "0.1.0"
description = "AI agent that finds its way around a website to achieve a goal (Playwright + Claude), with human-in-the-loop sign-in."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "playwright>=1.65.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
wayfinder = "wayfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wayfinder"]
