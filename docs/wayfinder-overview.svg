<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="t d" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Trebuchet MS',sans-serif">
  <title id="t">How Wayfinder works</title>
  <desc id="d">A cartoon in four steps: you give a website and a goal; the Wayfinder robot reads the page, plans, clicks and checks each step; it pauses so you can sign in yourself; it returns the answer with a step-by-step log.</desc>

  <!-- backdrop -->
  <rect x="6" y="6" width="988" height="398" rx="28" fill="#FFF7E8" stroke="#1F2A44" stroke-width="4"/>
  <circle cx="930" cy="60" r="26" fill="#FFE8A3" opacity=".7"/>
  <circle cx="60" cy="350" r="34" fill="#D7F5F0" opacity=".8"/>
  <text x="500" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2A44">Wayfinder: your web errand robot</text>

  <g stroke="#1F2A44" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ 1. you + goal ============ -->
    <ellipse cx="115" cy="312" rx="52" ry="8" fill="#1F2A44" opacity=".12" stroke="none"/>
    <!-- speech bubble -->
    <path d="M50 78 h170 a18 18 0 0 1 18 18 v46 a18 18 0 0 1 -18 18 h-88 l-22 22 l2 -22 h-62 a18 18 0 0 1 -18 -18 v-46 a18 18 0 0 1 18 -18 z" fill="#FFFFFF"/>
    <rect x="62" y="90" width="92" height="20" rx="10" fill="#DBEAFE" stroke-width="2"/>
    <!-- person -->
    <rect x="80" y="238" width="70" height="72" rx="28" fill="#FF6B6B"/>
    <circle cx="115" cy="212" r="30" fill="#FFD9B3"/>
    <path d="M86 206 q6 -34 34 -30 q24 2 26 26 q-16 -16 -32 -12 q-16 4 -28 16 z" fill="#5B3A29"/>
    <path d="M150 262 q22 -14 26 -40" fill="none"/>
    <circle cx="177" cy="219" r="6" fill="#FFD9B3"/>
  </g>
  <circle cx="105" cy="214" r="3.5" fill="#1F2A44"/>
  <circle cx="126" cy="214" r="3.5" fill="#1F2A44"/>
  <path d="M106 225 q10 9 20 0" fill="none" stroke="#1F2A44" stroke-width="3" stroke-linecap="round"/>
  <text x="108" y="105" text-anchor="middle" font-size="12" fill="#1D4ED8" font-family="Consolas,Menlo,monospace">shop.com</text>
  <text x="68" y="130" font-size="14" fill="#1F2A44">“Find the cheapest</text>
  <text x="68" y="149" font-size="14" fill="#1F2A44">trail shoes”</text>

  <!-- arrow 1 -> 2 -->
  <path d="M188 262 q24 -4 40 12" fill="none" stroke="#1F2A44" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M222 262 l10 14 l-17 0 z" fill="#1F2A44"/>

  <g stroke="#1F2A44" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ============ 2. robot + browser ============ -->
    <ellipse cx="300" cy="330" rx="50" ry="8" fill="#1F2A44" opacity=".12" stroke="none"/>
    <!-- browser window -->
    <rect x="332" y="78" width="270" height="222" rx="16" fill="#FFFFFF"/>
    <path d="M332 110 v-16 a16 16 0 0 1 16 -16 h238 a16 16 0 0 1 16 16 v16 z" fill="#E2E8F0"/>
    <circle cx="351" cy="94" r="5" fill="#FF6B6B" stroke-width="2"/>
    <circle cx="367" cy="94" r="5" fill="#FFD166" stroke-width="2"/>
    <circle cx="383" cy="94" r="5" fill="#4FD1C5" stroke-width="2"/>
    <rect x="400" y="86" width="186" height="16" rx="8" fill="#FFFFFF" stroke-width="2"/>
    <!-- nav pills -->
    <rect x="346" y="120" width="44" height="12" rx="6" fill="#C7D2FE" stroke-width="2"/>
    <rect x="396" y="120" width="44" height="12" rx="6" fill="#E2E8F0" stroke-width="2"/>
    <rect x="446" y="120" width="44" height="12" rx="6" fill="#E2E8F0" stroke-width="2"/>
    <!-- filters -->
    <rect x="346" y="148" width="16" height="16" rx="4" fill="#4FD1C5" stroke-width="2.5"/>
    <path d="M349.500 156 l3.500 4 l6 -8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="346" y="174" width="16" height="16" rx="4" fill="#FFFFFF" stroke-width="2.5"/>
    <rect x="346" y="200" width="16" height="16" rx="4" fill="#4FD1C5" stroke-width="2.5"/>
    <path d="M349.500 208 l3.500 4 l6 -8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- result cards -->
    <rect x="442" y="146" width="146" height="40" rx="9" fill="#FFF3C4" stroke-width="2.5"/>
    <rect x="442" y="194" width="146" height="40" rx="9" fill="#FFFFFF" stroke-width="2.5"/>
    <rect x="442" y="242" width="146" height="40" rx="9" fill="#FFFFFF" stroke-width="2.5"/>
    <path d="M459 157 l3 6.500 l7 .800 l-5.200 4.800 l1.400 7 l-6.200 -3.500 l-6.200 3.500 l1.400 -7 l-5.200 -4.800 l7 -.800 z" fill="#FFD166" stroke-width="2"/>
    <!-- robot -->
    <path d="M300 222 v-16" fill="none"/>
    <circle cx="300" cy="200" r="7" fill="#FFD166"/>
    <rect x="266" y="222" width="68" height="50" rx="16" fill="#4FD1C5"/>
    <rect x="274" y="276" width="52" height="42" rx="13" fill="#38B2AC"/>
    <path d="M284 318 v10 M316 318 v10" fill="none" stroke-width="6"/>
    <path d="M326 290 q16 -4 22 -22" fill="none"/>
    <circle cx="349" cy="264" r="6" fill="#4FD1C5"/>
    <path d="M274 292 q-14 2 -20 14" fill="none"/>
    <!-- compass -->
    <circle cx="246" cy="318" r="17" fill="#FFFFFF"/>
    <path d="M246 305 l5 13 h-10 z" fill="#FF6B6B" stroke-width="2"/>
    <path d="M246 331 l5 -13 h-10 z" fill="#CBD5E1" stroke-width="2"/>
    <circle cx="300" cy="296" r="6" fill="#FFD166" stroke-width="2.5"/>
    <circle cx="287" cy="245" r="9" fill="#FFFFFF" stroke-width="2.5"/>
    <circle cx="313" cy="245" r="9" fill="#FFFFFF" stroke-width="2.5"/>
    <path d="M291 261 q9 7 18 0" fill="none" stroke-width="3"/>
  </g>
  <circle cx="290" cy="244" r="4" fill="#1F2A44"/>
  <circle cx="316" cy="244" r="4" fill="#1F2A44"/>
  <!-- filter + card text lines -->
  <g fill="#94A3B8">
    <rect x="370" y="153" width="52" height="6" rx="3"/>
    <rect x="370" y="179" width="40" height="6" rx="3"/>
    <rect x="370" y="205" width="48" height="6" rx="3"/>
    <rect x="476" y="157" width="80" height="6" rx="3"/>
    <rect x="476" y="169" width="52" height="6" rx="3"/>
    <rect x="456" y="205" width="100" height="6" rx="3"/>
    <rect x="456" y="217" width="64" height="6" rx="3"/>
    <rect x="456" y="253" width="92" height="6" rx="3"/>
    <rect x="456" y="265" width="56" height="6" rx="3"/>
  </g>
  <text x="493" y="98" text-anchor="middle" font-size="10.500" fill="#64748B" font-family="Consolas,Menlo,monospace">shop.com/shoes</text>
  <!-- pointer on the checkbox + click sparks -->
  <path d="M364 214 l0 20 l5.500 -5 l4 9 l4 -2 l-4 -9 l7.500 0 z" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2.500" stroke-linejoin="round"/>
  <path d="M338 196 l-7 -5 M340 208 l-9 0 M338 220 l-7 5" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>

  <!-- arrow 2 -> 3 -->
  <path d="M612 205 q18 -10 34 0" fill="none" stroke="#1F2A44" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M641 196 l14 10 l-16 6 z" fill="#1F2A44"/>

  <g stroke="#1F2A44" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ============ 3. pause for sign-in ============ -->
    <ellipse cx="722" cy="300" rx="50" ry="8" fill="#1F2A44" opacity=".12" stroke="none"/>
    <path d="M662 84 h120 a16 16 0 0 1 16 16 v28 a16 16 0 0 1 -16 16 h-44 l-16 18 l0 -18 h-60 a16 16 0 0 1 -16 -16 v-28 a16 16 0 0 1 16 -16 z" fill="#FFFFFF"/>
    <!-- padlock -->
    <path d="M700 214 v-20 a22 22 0 0 1 44 0 v20" fill="none" stroke-width="9"/>
    <path d="M700 214 v-20 a22 22 0 0 1 44 0 v20" fill="none" stroke="#CBD5E1" stroke-width="3.5"/>
    <rect x="684" y="212" width="76" height="66" rx="14" fill="#FFD166"/>
    <circle cx="722" cy="238" r="8" fill="#1F2A44"/>
    <path d="M722 242 v16" fill="none" stroke-width="7"/>
    <!-- pause badge -->
    <circle cx="772" cy="208" r="21" fill="#FF6B6B"/>
    <path d="M765 198 v20 M779 198 v20" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  </g>
  <text x="722" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2A44">Your turn!</text>
  <text x="722" y="130" text-anchor="middle" font-size="13" fill="#1F2A44">Please sign in</text>

  <!-- arrow 3 -> 4 -->
  <path d="M800 232 q14 -10 28 -2" fill="none" stroke="#1F2A44" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M823 222 l14 10 l-16 6 z" fill="#1F2A44"/>

  <g stroke="#1F2A44" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ============ 4. result ============ -->
    <ellipse cx="905" cy="300" rx="52" ry="8" fill="#1F2A44" opacity=".12" stroke="none"/>
    <rect x="848" y="108" width="114" height="176" rx="14" fill="#FFFFFF"/>
    <rect x="880" y="96" width="50" height="24" rx="9" fill="#94A3B8"/>
    <circle cx="868" cy="150" r="10" fill="#4FD1C5" stroke-width="2.5"/>
    <circle cx="868" cy="182" r="10" fill="#4FD1C5" stroke-width="2.5"/>
    <circle cx="868" cy="214" r="10" fill="#4FD1C5" stroke-width="2.5"/>
    <path d="M863.500 150 l3.500 4 l6 -8 M863.500 182 l3.500 4 l6 -8 M863.500 214 l3.500 4 l6 -8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="862" y="238" width="86" height="30" rx="10" fill="#DBEAFE" stroke-width="2.5"/>
    <!-- sparkles -->
    <path d="M838 92 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#FFD166" stroke-width="2.5"/>
    <path d="M972 150 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#FFD166" stroke-width="2.5"/>
  </g>
  <g fill="#94A3B8">
    <rect x="886" y="147" width="62" height="6" rx="3"/>
    <rect x="886" y="179" width="50" height="6" rx="3"/>
    <rect x="886" y="211" width="58" height="6" rx="3"/>
  </g>
  <text x="905" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1D4ED8" font-family="Consolas,Menlo,monospace">{ JSON }</text>

  <!-- captions -->
  <g text-anchor="middle" fill="#1F2A44">
    <circle cx="115" cy="352" r="13" fill="#1F2A44"/>
    <circle cx="465" cy="340" r="13" fill="#1F2A44"/>
    <circle cx="722" cy="330" r="13" fill="#1F2A44"/>
    <circle cx="905" cy="330" r="13" fill="#1F2A44"/>
    <g fill="#FFFFFF" font-size="15" font-weight="bold">
      <text x="115" y="357">1</text><text x="465" y="345">2</text><text x="722" y="335">3</text><text x="905" y="335">4</text>
    </g>
    <text x="115" y="384" font-size="14" font-weight="bold">You give a site + a goal</text>
    <text x="465" y="372" font-size="14" font-weight="bold">It reads the page, plans, clicks</text>
    <text x="465" y="391" font-size="13">and checks every step</text>
    <text x="722" y="362" font-size="14" font-weight="bold">Pauses so you sign in</text>
    <text x="722" y="381" font-size="13">(it never sees passwords)</text>
    <text x="905" y="362" font-size="14" font-weight="bold">Returns the answer</text>
    <text x="905" y="381" font-size="13">+ a step-by-step log</text>
  </g>
</svg>
